<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div class="logo">
        <h1>🔥 FREE FIRE</h1>
        <p class="version">v1.19.0 - 2018</p>
      </div>

      <div class="login-content">
        <h2>Bem-vindo, Soldado!</h2>
        <p>Faça login com GitHub para entrar</p>

        <a href="/auth/github" class="btn-github">
          🐙 Login com GitHub
        </a>

        <div class="info-box">
          <p>✓ Autenticação segura OAuth2</p>
          <p>✓ Dados protegidos</p>
          <p>✓ Acesso rápido</p>
        </div>
      </div>

      <footer>
        <p>© 2018-2024 Free Fire</p>
      </footer>
    </div>
  </div>
</body>
</html>
